<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Now | Premium Carpet & Upholstery</title>
<meta name="description" content="Schedule your free quote for carpet cleaning, upholstery, tile, and more with Premium Carpet & Upholstery in Northern Colorado.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Get a Free Quote</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="gallery.html">Gallery</a>
    <a href="testimonials.html">Testimonials</a>
    <a href="contact.html">Contact</a>
    <a href="book.html">Book Now</a>
  </nav>
</header>
<section>
  <form action="#" method="post">
    <input type="text" name="name" placeholder="Name" required>
    <input type="text" name="address" placeholder="Address">
    <select name="service" required>
      <option value="">Select Service Type</option>
      <option value="carpet">Carpet Cleaning</option>
      <option value="upholstery">Upholstery Cleaning</option>
      <option value="tile">Tile Cleaning</option>
      <option value="duct">Air Duct Cleaning</option>
      <option value="other">Other</option>
    </select>
    <input type="tel" name="phone" placeholder="Phone">
    <input type="datetime-local" name="preferred" placeholder="Preferred Date/Time">
    <textarea name="notes" placeholder="Additional Notes"></textarea>
    <button type="submit">Request Quote</button>
  </form>
</section>
<footer>
  <p>© 2025 Premium Carpet & Upholstery</p>
</footer>
</body>
</html>
